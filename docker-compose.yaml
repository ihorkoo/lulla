services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lulla
      POSTGRES_USER: lulla
      POSTGRES_PASSWORD: lulla
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lulla -d lulla"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-do-not-use-in-prod-please-rotate
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_SETTINGS_MODULE: lulla.settings.development
      POSTGRES_DB: lulla
      POSTGRES_USER: lulla
      POSTGRES_PASSWORD: lulla
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMMA_MODEL: gemma-4-26b-a4b-it
      LLM_MAX_OUTPUT_TOKENS: "4096"
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "10080"
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: "30"
      EMBEDDING_PROVIDER: gemini
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_DIMENSIONS: "768"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "uv run python manage.py migrate --noinput &&
               uv run python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
      JWT_COOKIE_SECRET: dev-cookie-secret-do-not-use-in-prod-please-rotate
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: pnpm dev

volumes:
  postgres_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:
